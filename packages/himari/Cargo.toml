[package]
name = "himari"
version.workspace = true
edition.workspace = true
description = "Dimensioned formula IR: parse LaTeX/MATLAB/paper notation once, check kg·m·s·A·K·mol·cd at compile time, and emit Rust."
rust-version.workspace = true
license-file.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]

libm = { workspace = true }

[dev-dependencies]

# Compatibility test only: `himari::Error` must work as an `anyhow::Error` source.
anyhow = "1"

[features]
default = ["std"]
std = []
