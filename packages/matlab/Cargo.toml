[package]
name = "himari-matlab"
version.workspace = true
edition.workspace = true
description = "MATLAB-style (matex) and Unicode-paper front-end for himari: the canonical human-readable surface."
rust-version.workspace = true
license-file.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]

himari = { workspace = true, default-features = false }
pest = { version = "^2", default-features = false }
pest_derive = { workspace = true }

[features]
default = ["std"]
std = ["himari/std", "pest/std"]
