[package]
name = "himari-lean"
version = "0.1.0"
edition.workspace = true
description = "Lean 4 co-process for himari: generate self-contained proof obligations, drive `lean` as a subprocess, and cross-check the answer with an independent Rust oracle."
rust-version.workspace = true
license-file.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "himari-lean"
path = "src/bin/himari-lean.rs"

[dependencies]

# `hex_digest` (SHA-256) is the only thing borrowed from the workspace today.
# Reusing it instead of pulling a second SHA-256 implementation keeps the
# dependency surface at the level the repository allows.
himari-loader = { workspace = true }

# serde_json is used as a standalone value tree (`Value`) only. The wire format
# is small and fully specified in one place, so no derive machinery is needed.
serde_json = { version = "1.0" }