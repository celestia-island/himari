[package]
name = "himari-standards"
version.workspace = true
edition.workspace = true
description = "Typed calculators for published engineering standards (Brinell hardness, tensile properties, standard atmosphere, decimal rounding) with explicit provenance."
rust-version.workspace = true
license-file.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "himari-standard"

[dependencies]

# Formula lane: dimensioned expressions are checked at compile time.
himari-macros = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "himari-standard"
path = "src/bin/himari-standard.rs"