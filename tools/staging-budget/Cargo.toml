[package]
name = "himari-staging-budget"
version.workspace = true
edition.workspace = true
publish = false
description = "Counts uncatalogued error producers in the workspace by AST (gate: the total may only go down)."

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
# `span-locations` lets `--list` report the 1-based line of every site.
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
